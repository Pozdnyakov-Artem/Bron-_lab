[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bronylab"
version = "0.2.2"
description = "Equipment booking for a university laboratory"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "PyYAML==6.0.3", "waitress==3.0.2", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bronylab = "bronylab.cli:main"

[tool.setuptools.package-data]
bronylab = ["templates/*.html", "static/*", "static/manual/manual/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
